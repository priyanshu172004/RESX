[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resx-api"
version = "0.1.0"
description = "RESX orchestration and analysis service"
requires-python = ">=3.10"

dependencies = [
  # --- Web ---
  "fastapi>=0.115",
  # Imported directly (`starlette.concurrency`, `starlette.responses`), so it
  # is declared rather than relied on as a FastAPI transitive. A dependency you
  # import is a dependency you own.
  "starlette>=0.41",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",

  # --- Security ---
  # Argon2id for passwords; PyJWT for RS256 access tokens; cryptography for
  # field-level AES-256-GCM. See docs/05-SECURITY.md §6.
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43.0",
  "pyotp>=2.9",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",

  # --- Data ---
  # The production store. It was never declared — `app/store/mongo.py` has
  # imported it since it was written, and every environment that worked had it
  # installed for some other reason. A clean install had no MongoDB backend at
  # all, and `import pymongo` failed at collection time.
  "pymongo>=4.9",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.2",
  "arq>=0.26",

  # --- Analysis (the deterministic engine) ---
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  # PDF export (`app/reporting/export.py`) and the gold-corpus generator both
  # import it. Also never declared.
  "reportlab>=4.2",
  "pyarrow>=17.0",
  "pint>=0.24",
  "rapidfuzz>=3.10",

  # --- Ingestion ---
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "charset-normalizer>=3.4",
  # OCR for scanned pages. `pytesseract` is a thin wrapper around the
  # `tesseract` executable, which is a system package and NOT installed by pip
  # — see app/ingest/ocr.py, which reports its absence with the install
  # command rather than letting a scan ingest as an empty page.
  # `pypdfium2` rasterises the page; it ships its own renderer as a wheel,
  # unlike pdf2image which shells out to poppler.
  "pytesseract>=0.3.13",
  "pypdfium2>=4.30",
  "pillow>=10.4",

  # --- Orchestration & intelligence ---
  "langgraph>=0.2.45",
  "langgraph-checkpoint-postgres>=2.0",
  "anthropic>=0.39",
  "mcp>=1.1",
  "httpx>=0.27",

  # --- Observability ---
  "structlog>=24.4",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "types-redis",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]
# S101 (assert) is allowed in tests only; see per-file ignores.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) and S105/S106 (hardcoded credentials) are the substance of a
# test suite for an auth system, not a finding in one.
"tests/*" = ["S101", "S105", "S106", "E501"]
# The gold-corpus generator is invoked with `sys.executable` and a path this
# repository owns. There is no untrusted input in that call.
"tests/conftest.py" = ["S101", "S105", "S106", "E501", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Third-party packages that ship no type information. Listed individually
# rather than with a global `ignore_missing_imports` so that a NEW untyped
# dependency shows up as an error and has to be considered, instead of being
# absorbed silently — which is how an untyped surface grows.
[[tool.mypy.overrides]]
module = [
  "scipy.*",       # scipy-stubs exists but lags the runtime we pin
  "openpyxl.*",
  "pytesseract.*",
  "reportlab.*",   # no stubs published
  # The OTLP HTTP exporter ships separately from the SDK and is optional, so
  # it may not be installed at all. See app/core/telemetry.py.
  "opentelemetry.exporter.*",
  "docx.*",        # python-docx ships none
  "pypdfium2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
